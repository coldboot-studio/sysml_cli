[package]
name = "sysml-validate"
version = "0.8.0"
edition = "2021"
description = "CLI preflight validator for SysML v2 and KerML textual models."
license = "MIT"
repository = "https://github.com/Systems-Modeling/SysML-v2-Release"

[[bin]]
name = "sysml-validate"
path = "src/main.rs"

[dependencies]
# US-107: stable diagnostic fingerprints. RustCrypto sha2 is the standard
# choice and has a FIPS-validated variant available later.
sha2 = { version = "0.10", default-features = false }
# US-108: enforce --timeout on the official backend without writing our own
# cross-platform child-process polling loop. Maintained by alexcrichton.
wait-timeout = "0.2"
# US-105: sysml-validate.toml config + US-101: SARIF emitter.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
# US-202 (Phase 2): embed the OMG SysML v2 standard library at compile
# time so the validator is self-contained and air-gap-capable. The
# library source lives at vendor/sysml-v2-release/sysml.library/ as a
# git submodule pinned to OMG release tag 2026-04 (EPL-2.0).
include_dir = { version = "0.7", features = ["glob"] }

# Reproducible-build settings (US-109). Single codegen unit and fat LTO
# produce a single deterministic object; strip removes timestamps and
# symbol tables that vary across runs. panic=abort keeps the binary
# smaller and removes unwinding machinery that varies subtly between
# rustc versions.
[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"
overflow-checks = false
opt-level = 3
debug = false
incremental = false
