# Release workflow. Triggered by pushing a tag of the form `v*`.
#
# Produces, for each target triple:
#   - the compiled binary
#   - a CycloneDX 1.6 SBOM (cargo-cyclonedx)
#   - an SPDX 3.0 SBOM (anchore/sbom-action / syft)
#   - a SHA-256 checksum
#   - a Sigstore (cosign) keyless signature, Rekor-logged
#   - a detached GPG signature (long-lived key from repo secret)
#   - SLSA v1.0 Build L3 in-toto build-provenance attestation
#     (actions/attest-build-provenance)
#
# After the matrix build, a `reproducibility-check` job (Batch O-2)
# rebuilds the Linux x86_64 binary on a clean runner and diffoscopes
# the two outputs. Bit-identical rebuild is a release-blocking
# guarantee, not an aspiration.
#
# Every artifact is attached to the GitHub Release. Consumers verify with
# the recipe in docs/SECURITY.md.
#
# ----------------------------------------------------------------------
# IMPORTANT BEFORE FIRST RUN
# ----------------------------------------------------------------------
# 1. Every `uses:` is pinned to a commit SHA with the human-readable
#    tag in a trailing comment. Dependabot bumps should update the SHA
#    and the comment together; do not unpin (Batch O-1).
# 2. Repository secrets required:
#      GPG_SIGNING_KEY        — ASCII-armored GPG private key
#      GPG_SIGNING_PASSPHRASE — passphrase for that key
#    Generate with: gpg --armor --export-secret-keys $KEY_ID
#    Document the key fingerprint in docs/SECURITY.md.
# 3. The workflow assumes the calling identity has `id-token: write`,
#    `contents: write`, and `attestations: write` permission via the
#    job-level `permissions:` block below.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.4.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
          - target: x86_64-apple-darwin
            os: macos-13
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write       # needed to create the GitHub Release and upload artifacts
      id-token: write       # OIDC token for cosign keyless + SLSA provenance
      attestations: write   # SLSA build provenance
    env:
      # Make embedded timestamps deterministic across runs of the same
      # commit (US-109). Picked from the tag's commit author date.
      SOURCE_DATE_EPOCH: ""  # set per step below
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # need full history to read tag author date
          submodules: recursive

      - name: Resolve SOURCE_DATE_EPOCH
        shell: bash
        run: |
          # Use the commit author date of the tag as the deterministic
          # epoch. Same source → same SOURCE_DATE_EPOCH → same binary.
          ts="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=$ts" >> "$GITHUB_ENV"
          echo "Using SOURCE_DATE_EPOCH=$ts"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.cross
        uses: taiki-e/install-action@86ec8296ca78c5cfba526854b020d4e58cf41e67 # v2.44.51
        with:
          tool: cross

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          key: ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        shell: bash
        run: |
          cross build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        id: stage
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/sysml-validate${{ matrix.ext }}"
          dest="dist/sysml-validate-${{ matrix.target }}${{ matrix.ext }}"
          cp "$src" "$dest"
          echo "artifact=$dest" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$dest")" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX 1.6 SBOM
        # Uses Syft (via anchore/sbom-action) for CycloneDX too — the
        # same tool produces both SBOM formats. cargo-cyclonedx was
        # tried first but its released versions max out at spec 1.5;
        # Syft natively emits CycloneDX 1.6.
        uses: anchore/sbom-action@55dc4ee22412511ee8c3142cbea40418e6cec693 # v0.17.8
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sysml-validate-${{ matrix.target }}.cdx.json

      - name: Generate SPDX 3.0 SBOM
        uses: anchore/sbom-action@55dc4ee22412511ee8c3142cbea40418e6cec693 # v0.17.8
        with:
          path: .
          format: spdx-json
          output-file: dist/sysml-validate-${{ matrix.target }}.spdx.json
          # Anchore's action keys off the working directory contents;
          # the SPDX doc names this artifact, not the binary directly.

      - name: SHA-256 checksum
        shell: bash
        run: |
          cd dist
          # Cross-platform sha256. Pick what's available on each runner.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ steps.stage.outputs.name }}" \
              > "${{ steps.stage.outputs.name }}.sha256"
          else
            shasum -a 256 "${{ steps.stage.outputs.name }}" \
              > "${{ steps.stage.outputs.name }}.sha256"
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0
        with:
          cosign-release: "v2.4.1"

      - name: Sign binary with cosign (keyless OIDC)
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          cd dist
          cosign sign-blob \
            --bundle "${{ steps.stage.outputs.name }}.cosign.bundle" \
            "${{ steps.stage.outputs.name }}"
          # The bundle contains the certificate, signature, and Rekor
          # transparency-log inclusion proof. Verifiers need ONLY this
          # bundle plus the binary (no online lookup) once they trust
          # the Sigstore root.

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@cb9bde2e2525e640591a934b1fd28eef1dcaf5e5 # v6.2.0
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
          passphrase: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        # If the secrets are absent (initial bring-up), the rest of the
        # job continues without GPG signatures. The release will be
        # missing one trust path but still verifiable via cosign.
        continue-on-error: true

      - name: GPG-sign binary
        shell: bash
        run: |
          if gpg --list-secret-keys 2>/dev/null | grep -q sec; then
            cd dist
            gpg --detach-sign --armor \
              --output "${{ steps.stage.outputs.name }}.asc" \
              "${{ steps.stage.outputs.name }}"
          else
            echo "::warning::No GPG key imported; skipping GPG signature."
          fi

      - name: SLSA v1.0 Build L3 provenance
        # Uses the GitHub-native attestation action. This produces an
        # in-toto attestation with predicate type
        # https://slsa.dev/provenance/v1 and stores it both as an OCI
        # referrer and as a workflow artifact. SLSA v1.0 Build L3 is the
        # level documented at https://slsa.dev/spec/v1.0/levels.
        uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
        with:
          subject-path: dist/${{ steps.stage.outputs.name }}

      - name: Stage SLSA provenance into dist/
        # actions/attest-build-provenance writes the attestation as an
        # OCI referrer + workflow artifact. The bundle assembler also
        # wants it as a local file alongside the binary. If the
        # `attestation` step published a workflow artifact named
        # `provenance.intoto.jsonl`, copy it into dist/; otherwise the
        # assembler simply skips the attestation/ directory.
        shell: bash
        run: |
          if [[ -f attestations/${{ steps.stage.outputs.name }}.intoto.jsonl ]]; then
            cp "attestations/${{ steps.stage.outputs.name }}.intoto.jsonl" dist/provenance.intoto.jsonl
          fi

      - name: Install bundle dependencies (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # zip — Linux runner lacks it by default; macOS already ships it.
          if ! command -v zip >/dev/null 2>&1; then
            if [[ "${RUNNER_OS}" == "Linux" ]]; then
              sudo apt-get update && sudo apt-get install -y zip
            fi
          fi
          # gnu-tar — macOS ships BSD tar, which doesn't support
          # --sort=name / --owner / --numeric-owner used by the bundle
          # assembler for deterministic output. Install GNU tar so the
          # script (which probes for `gtar`) can find it.
          if [[ "${RUNNER_OS}" == "macOS" ]] && ! command -v gtar >/dev/null 2>&1; then
            brew install gnu-tar
          fi

      - name: Install bundle dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # windows-latest ships 7-Zip but NOT GNU `zip` in the bash PATH.
        # The assembler invokes `zip -X -r`, so we install it via choco
        # (Chocolatey is preinstalled on windows-latest runners).
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            choco install zip --no-progress -y
            # choco drops the binary at C:\ProgramData\chocolatey\bin
            # which is on PATH for subsequent steps; verify here too.
          fi
          zip --version >/dev/null
          tar --version >/dev/null

      - name: Assemble government release bundle (US-308)
        # Per-target bundle: binary + signatures + SBOMs + SLSA +
        # every doc (executive summary, tech manual, PRD, security,
        # offline, threat model, reproducing, accessibility, full
        # compliance pack). Output is one archive per target, named
        # sysml-validate-<version>-<target>.{tar.gz,zip}.
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        run: |
          version="${{ github.ref_name || inputs.tag }}"
          version="${version#v}"  # strip leading v from tag if present
          bash scripts/assemble-release-bundle.sh \
            "${version}" "${{ matrix.target }}" dist

      - name: Compute bundle archive name
        id: bundle
        shell: bash
        run: |
          version="${{ github.ref_name || inputs.tag }}"
          version="${version#v}"
          case "${{ matrix.target }}" in
            *windows*) ext="zip"  ;;
            *)         ext="tar.gz" ;;
          esac
          name="sysml-validate-${version}-${{ matrix.target }}.${ext}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "path=dist/bundle/${name}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          files: |
            dist/sysml-validate-${{ matrix.target }}${{ matrix.ext }}
            dist/sysml-validate-${{ matrix.target }}${{ matrix.ext }}.sha256
            dist/sysml-validate-${{ matrix.target }}${{ matrix.ext }}.cosign.bundle
            dist/sysml-validate-${{ matrix.target }}.cdx.json
            dist/sysml-validate-${{ matrix.target }}.spdx.json
            dist/sysml-validate-${{ matrix.target }}${{ matrix.ext }}.asc
            ${{ steps.bundle.outputs.path }}
            ${{ steps.bundle.outputs.path }}.sha256
          fail_on_unmatched_files: false  # GPG signature may be absent

  # ----------------------------------------------------------------------
  # Reproducibility verification (Batch O-2 / US-109).
  #
  # Rebuilds the Linux x86_64 binary from the same source on an
  # independent runner instance, then diffoscopes the two binaries.
  # If they differ, the release is unreproducible — diffoscope's
  # output names the offending sections (debug info, build paths,
  # timestamps, code-gen ordering). Failing the release on diff is
  # the point.
  # ----------------------------------------------------------------------
  reproducibility-check:
    name: reproducibility (linux x86_64)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve SOURCE_DATE_EPOCH
        shell: bash
        run: |
          ts="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=$ts" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Independent rebuild
        shell: bash
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          mkdir -p verify
          cp target/x86_64-unknown-linux-gnu/release/sysml-validate \
            verify/sysml-validate-rebuild

      - name: Download original release binary
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
        # This step intentionally fails closed: if the matrix build
        # hasn't produced a release artifact yet, we have nothing to
        # diff against and the workflow stops here. The job depends on
        # `build` so this should always resolve in practice.

      - name: Fetch matrix-built artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name || inputs.tag }}"
          gh release download "$tag" \
            --pattern 'sysml-validate-x86_64-unknown-linux-gnu' \
            --dir verify
          mv verify/sysml-validate-x86_64-unknown-linux-gnu \
            verify/sysml-validate-original

      - name: Install diffoscope
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y diffoscope

      - name: diffoscope --exit-code
        shell: bash
        run: |
          # Fails the job (non-zero exit) on any difference. Output
          # names the sections that differ so the maintainer can chase
          # the source of non-determinism. The expected outcome on a
          # well-behaved release is "no differences detected" plus exit 0.
          diffoscope --exit-code \
            verify/sysml-validate-original \
            verify/sysml-validate-rebuild
