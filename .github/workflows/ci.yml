# Pull-request CI. Verifies the build, tests, lints, and formatting on
# every change. Release artifacts are produced by release.yml, not here.
#
# Permissions deliberately minimal: read-only on contents, nothing else.
# This workflow does NOT have permission to publish anything.
#
# Every `uses:` is pinned to a commit SHA. The trailing comment names
# the human-readable tag so Dependabot bumps remain readable and a
# SLSA L3 audit doesn't flag mutable refs (US-111 / Batch O-1).

name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
  # Nightly differential-corpus run (Batch O-7). Builds the release
  # binary against the vendored OMG corpora and fails on histogram
  # drift. Loud failure is the point: a tree-sitter-sysml bump or a
  # validator change that moves counts should surface here, not in
  # someone else's CI.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install Rust toolchain
        # Reads rust-toolchain.toml automatically; no version arg.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      - name: Build (locked)
        run: cargo build --locked --verbose

      - name: Test (locked)
        run: cargo test --locked --verbose

  lint:
    name: lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        # -D warnings turns lint warnings into errors. Adjust the deny
        # list when adopting clippy-style rules.
        run: cargo clippy --locked --all-targets -- -D warnings

  audit:
    name: cargo-audit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2.81.3
        with:
          tool: cargo-audit

      - name: Audit dependencies for known vulnerabilities
        # Reads Cargo.lock and checks against the RustSec advisory db.
        # Counts toward NIST SSDF RV.1 (identify and respond to
        # vulnerabilities in third-party components).
        #
        # continue-on-error TEMPORARY: upstream rustsec/advisory-db
        # currently ships a malformed RUSTSEC-2026-0076.md
        # (libcrux-ml-dsa) that fails cargo-audit's TOML parser before
        # any audit logic runs, so the job can't even reach an --ignore
        # filter. Revert to strict failure once upstream repairs the
        # file; track at https://github.com/rustsec/advisory-db
        continue-on-error: true
        run: cargo audit --deny warnings

  differential:
    name: differential (nightly)
    # Cron-only — the corpus run is heavyweight and depends on the
    # vendored submodule. Manual `workflow_dispatch` can also trigger
    # it for ad-hoc verification.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          key: differential

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run differential corpus harness
        # The test is `#[ignore]` for the default loop because it
        # depends on the submodule and walks ~150 files. Drift in the
        # histogram is a real signal — a Pilot/grammar change moved
        # the counts. Update the baseline constants in the same commit
        # as the validator change that caused the shift.
        run: cargo test --release --locked --test differential -- --ignored --nocapture
